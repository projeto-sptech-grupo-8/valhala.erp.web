<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/valhalla-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161412" />
    <meta name="description" content="Valhalla — gestão completa de estoque, vendas e financeiro." />
    <title>Valhalla · Gestão de Salão</title>
  </head>
  <body>
    <script>
      // aplica o tema do painel antes do React montar — evita o "piscar" ao recarregar
      try { if (/^#\/./.test(location.hash) && localStorage.getItem('valhalla:tema') === 'light') document.documentElement.dataset.theme = 'light' } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
